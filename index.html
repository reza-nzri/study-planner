<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DAISY · Studienplan PO 2021</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#202936;font:14px system-ui,sans-serif}header{padding:24px 28px;background:white;border-bottom:1px solid #e2e8f0}h1{font-size:23px;margin:0 0 4px}small,.muted{color:#64748b}button,a,input,select{font:inherit}button{cursor:pointer;border:1px solid #d5dce5;background:white;border-radius:8px;padding:8px 11px;color:inherit}button:hover{background:#e8f1fa}a{color:#0874a4;text-decoration:none}.primary{background:#096d91;color:white;border:0}.stats{display:grid;grid-template-columns:1fr 1fr 2fr;gap:14px;margin:20px 0}.stat{background:#f4f6f9;padding:14px;border-radius:10px}.big{font-size:30px;font-weight:750}.track{height:10px;background:#dfe5ec;border-radius:10px;overflow:hidden;margin:10px 0}.fill{height:100%;background:#c40030}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar .muted{margin-left:auto}main{padding:20px 22px}.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(205px,1fr);gap:10px;overflow-x:auto;min-height:65vh;padding-bottom:15px}.lane{background:#edf0f3;border:2px solid transparent;border-radius:12px;padding:10px;min-height:400px}.lane.current{background:#d9eef7}.lane.over{border-color:#008ab5}.lanehead{display:flex;gap:10px;align-items:center;margin-bottom:16px}.num{font-size:40px;font-weight:700;line-height:1}.module{background:white;border-radius:9px;padding:11px;margin-bottom:9px;border-left:5px solid var(--c);box-shadow:0 2px 6px #15243b0b;cursor:grab}.module:active{cursor:grabbing}.top{display:flex;gap:6px;justify-content:space-between;align-items:start}.name{font-weight:650;overflow-wrap:anywhere}.cp{white-space:nowrap;font-size:12px}.code{font-size:11px;color:#64748b;margin:4px 0 9px}.bottom{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.bottom input[type=number]{width:58px;padding:5px;border:1px solid #ccd5df;border-radius:5px}.bottom button{padding:3px 6px}.grade{font-size:12px;color:#64748b}.done{color:#137448}.fail{color:#b42318}.add{width:100%;border-style:dashed;background:transparent;color:#64748b}.legend{display:flex;gap:13px;flex-wrap:wrap;margin:15px 0}.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}dialog{border:0;border-radius:15px;width:min(520px,95vw);padding:24px;box-shadow:0 20px 70px #0004}dialog::backdrop{background:#17253677}form label{display:block;font-weight:600;margin:12px 0 5px}form input:not([type=checkbox]),form select{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:7px}form .pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}footer{padding:0 24px 24px;color:#64748b;font-size:12px}@media(max-width:700px){header{padding:16px}.stats{grid-template-columns:1fr 1fr}main{padding:12px}.board{grid-auto-columns:240px}}
.module{transition:box-shadow .18s,transform .18s}.module:hover{box-shadow:0 5px 16px #15243b22;transform:translateY(-2px)}.module.before{border-top:3px solid #008ab5}.module.after{border-bottom:3px solid #008ab5}button:focus-visible{outline:2px solid #008ab5} @media(prefers-reduced-motion:reduce){*{transition:none!important}} </style><header><h1>DAISY <span style="color:#c40030">·</span> Studienplan</h1><small>Hochschule Düsseldorf · B.Sc. · PO 2021</small><div class="stats" id="stats"></div><div class="toolbar"><button class="primary" onclick="edit(null,3)">+ Modul hinzufügen</button><button onclick="exportData()">↓ JSON Export</button><button onclick="document.querySelector('#file').click()">↑ JSON Import</button><input id="file" type="file" accept=".json,application/json" hidden><button onclick="connectDrive()">Google Drive verbinden</button><button onclick="pullDrive()">Cloud laden</button><button onclick="pushDrive()">Cloud speichern</button><span id="cloudStatus" class="muted"></span><button onclick="resetData()">Zurücksetzen</button><a id="manual" target="_blank" rel="noopener">Modulhandbuch ↗</a><span class="muted" id="saved"></span></div></header><main><div class="legend" id="legend"></div><div class="board" id="board"></div></main><footer>Planungswerkzeug · CP-gewichteter Punktedurchschnitt, unbenotete Module zählen nur zum Fortschritt. Keine amtliche Notenbescheinigung. <a href="https://medien.hs-duesseldorf.de/studium/studiengaenge/bdaisy/studieninhalt" target="_blank">HSD Studieninhalt PO 2021</a></footer><dialog id="dlg"><form id="form"><h2 id="dialogTitle">Modul bearbeiten</h2><label>Modulbibliothek (vorhandener Katalog)</label><input id="library" list="catalogue" placeholder="Modul suchen …"><datalist id="catalogue"></datalist><label>Modulname</label><input id="name" required><div class="pair"><div><label>Kürzel / Kennnummer</label><input id="code"></div><div><label>Credit Points</label><input id="cp" type="number" min="1" max="210" required></div></div><div class="pair"><div><label>Semester</label><select id="sem"></select></div><div><label>Kategorie</label><select id="cat"></select></div></div><label>Modulhandbuch URL</label><input id="mh" type="url"><label>Moodle Kurs URL</label><input id="moodle" type="url" placeholder="https://mdl.hs-duesseldorf.de/course/view.php?id=…"><label>Bewertung</label><select id="type"><option value="graded">Benotet (0–100 Punkte)</option><option value="pass">Unbenotet (bestanden)</option></select><label><input id="count" type="checkbox"> Für Studienabschluss berücksichtigen</label><div class="actions"><button type="button" id="del" onclick="removeModule()">Löschen</button><button type="button" onclick="dlg.close()">Abbrechen</button><button class="primary">Speichern</button></div></form></dialog><script>
const handbook='https://medien.hs-duesseldorf.de/studium/studiengaenge/Documents/Modulhandb%C3%BCcher/Modulhandbuch_DAISY_V6-3_final.pdf';const cats={'DS & AI':'#00a9dc','Angewandte Informatik':'#009b9d','Software & Programmierung':'#efb500','Mathematik & Statistik':'#f47d82','Sozial & Gesellschaft':'#aaa7ea','Wahlpflicht / Fokus':'#8aba72','Abschluss':'#a2aab5'};const C=Object.keys(cats);const rows=[
['D1.1','Einführung in Intelligente Systeme',7,1,0,11],['D1.2','Ubiquitous Computing',5,1,1,13],['D1.3','Programmierung für Data Science und Künstliche Intelligenz',8,1,2,14],['D1.4','Mathematik für Data Science & AI',5,1,3,15],['D1.5','Informationsvisualisierung',5,1,4,17],['D2.1','Einführung Data Science',5,2,0,20],['D2.2','Datenbanken und Informationssysteme',8,2,1,22],['D2.3','Webtechnologien',5,2,2,24],['D2.4','Formale Modelle, Algorithmen, Diskrete Mathematik',5,2,3,25],['D2.5','Gesellschaftliche und soziale Implikationen, Technikfolgenabschätzung',7,2,4,27],['D3.1','Einführung Künstliche Intelligenz',5,3,0,30],['D3.2','Information Security and Privacy',7,3,1,32],['D3.3','Data Science und AI Infrastrukturen',5,3,2,34],['D3.4','Stochastik und Optimierung',8,3,3,35],['D3.5','Rechtliche und Wirtschaftliche Implikationen und Geschäftsmodelle',5,3,4,37],['WPM 1 · D4.2.1','Visual Analytics',5,4,5,48],['WPM 2 · D4.2.2','Immersive Visualisierung',5,4,5,49],['WPM 3 · D4.1.2','Big Data Engineering',5,5,5,42],['WPM 4 · D5.2.1','Virtual und Augmented Reality',5,5,5,50],['PF 5.2','Marketing Analytics',5,4,5,110],['PF 5.4','Entrepreneurship',5,4,5,113],['PF 5.5','Business Model and Marketing Project',10,4,5,114],['PF 5.1','Value Chain Analytics',5,5,5,108],['PF 5.3','Innovationsmanagement',5,5,5,111],['PF 5.6','Financial Modelling Project',10,5,5,115],['ExtSem','Externes Semester',30,6,6,7],['D7.1','Individuelle Vertiefung',5,7,6,7],['D7.2','Wissenschaftliche Vertiefung',10,7,6,7],['BAKoll','Bachelorarbeit mit Kolloquium',15,7,6,7]];
const initial=()=>rows.map((r,i)=>({id:'m'+i,code:r[0],name:r[1],cp:r[2],sem:r[3],cat:C[r[4]],mh:handbook,moodle:'',points:null,type:r[0]==='ExtSem'?'pass':'graded',passed:false,count:true}));let modules=initial(), semesters=7;try{const s=JSON.parse(localStorage.getItem('daisy-plan-v2'));if(s){modules=s.modules;semesters=s.semesters}}catch(e){}const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const url=v=>{try{let u=new URL(v);return ['https:','http:'].includes(u.protocol)?esc(u.href):''}catch{return ''}};const grade=p=>p>=95?1:p>=90?1.3:p>=85?1.7:p>=80?2:p>=75?2.3:p>=70?2.7:p>=65?3:p>=60?3.3:p>=55?3.7:p>=50?4:5;const passed=m=>m.type==='pass'?m.passed:m.points!==null&&m.points>=50;const sum=a=>a.reduce((s,m)=>s+m.cp,0);function save(){if(token&&cloudReady&&!loading){dirty=true;clearTimeout(syncTimer);syncTimer=setTimeout(()=>pushDrive(true),1800)}try{localStorage.setItem('daisy-plan-v2',JSON.stringify({version:1,modules,semesters}));$('saved').textContent='✓ Lokal gespeichert'}catch{$('saved').textContent='Speicherung nicht verfügbar – JSON exportieren'}}function stats(){let all=modules.filter(m=>m.count),done=all.filter(passed),graded=done.filter(m=>m.type==='graded'),cp=sum(graded),p=cp?graded.reduce((s,m)=>s+m.points*m.cp,0)/cp:null; $('stats').innerHTML=`<div class="stat"><small>Durchschnitt (Punkteskala)</small><div class="big">${p===null?'–':grade(p).toFixed(1)}</div><small>${p===null?'Keine Noten':p.toFixed(2)+' Punkte'}</small></div><div class="stat"><small>Gewichteter Notenschnitt</small><div class="big">${cp?(graded.reduce((s,m)=>s+grade(m.points)*m.cp,0)/cp).toFixed(2):'–'}</div><small>Einzelnoten × CP</small></div><div class="stat"><small>Gesamtes Studium</small><div class="big">${sum(done)} / 210 CP</div><div class="track"><div class="fill" style="width:${Math.min(100,sum(done)/210*100)}%"></div></div><small>${Math.round(sum(done)/210*100)}% abgeschlossen</small></div>`}function update(id,v){let m=modules.find(x=>x.id===id);if(m.type==='pass')m.passed=v;else m.points=v===''?null:Math.max(0,Math.min(100,Number(v)));save();render()}
function move(id,n,target,after){let m=modules.find(x=>x.id===id);if(!m||id===target)return;modules=modules.filter(x=>x.id!==id);m.sem=n;let i=target?modules.findIndex(x=>x.id===target):-1;modules.splice(i<0?modules.length:i+(after?1:0),0,m);save();render()}function render(){stats();$('board').innerHTML='';for(let n=1;n<=semesters;n++){let ms=modules.filter(m=>m.sem===n),term='Semester '+n;let lane=document.createElement('section');lane.className='lane'+(false?' current':'');lane.innerHTML=`<div class="lanehead"><span class="num">${n}</span><div><b>${term}</b><br><small>${sum(ms.filter(m=>m.count))} CP · ${sum(ms.filter(m=>m.count&&passed(m)))} bestanden</small></div></div>`;lane.ondragover=e=>{e.preventDefault();lane.classList.add('over')};lane.ondragleave=()=>lane.classList.remove('over');lane.ondrop=e=>{e.preventDefault();move(e.dataTransfer.getData('text/plain'),n,null,false)};for(let m of ms){let card=document.createElement('article');card.className='module';card.style.setProperty('--c',cats[m.cat]||'#aaa');card.draggable=true;card.ondragstart=e=>e.dataTransfer.setData('text/plain',m.id);card.ondragover=e=>{e.preventDefault();e.stopPropagation();let after=e.clientY>card.getBoundingClientRect().top+card.offsetHeight/2;card.classList.toggle('after',after);card.classList.toggle('before',!after)};card.ondragleave=()=>card.classList.remove('before','after');card.ondrop=e=>{e.preventDefault();e.stopPropagation();move(e.dataTransfer.getData('text/plain'),n,m.id,card.classList.contains('after'))};card.innerHTML=`<div class="top"><span class="name">${esc(m.name)}</span><span class="cp">${m.cp} CP</span></div><div class="code">${esc(m.code)}${m.count?'':' · Zusatzmodul'}</div><div class="bottom">${m.type==='pass'?`<label><input type="checkbox" ${m.passed?'checked':''}> bestanden</label>`:`<input aria-label="Punkte" type="number" min="0" max="100" step="1" value="${m.points===null?'':Number(m.points)}" placeholder="–"><span class="grade ${passed(m)?'done':m.points!==null?'fail':''}">${m.points===null?'Punkte':grade(m.points).toFixed(1)}</span>`}<span style="flex:1"></span>${url(m.mh)?`<a href="${url(m.mh)}" target="_blank" rel="noopener" title="Modulhandbuch">📖</a>`:''}${url(m.moodle)?`<a href="${url(m.moodle)}" target="_blank" rel="noopener" title="Moodle">↗ Moodle</a>`:''}<button title="Bearbeiten">⚙</button></div>`;let inp=card.querySelector('input');inp.onchange=()=>update(m.id,m.type==='pass'?inp.checked:inp.value);card.querySelector('button').onclick=()=>edit(m.id);lane.append(card)}let b=document.createElement('button');b.className='add';b.textContent='+ Modul';b.onclick=()=>edit(null,n);lane.append(b);$('board').append(lane)}let b=document.createElement('button');b.textContent='+ Semester';b.onclick=()=>{if(semesters<50){semesters++;save();render()}};$('board').append(b)}
$('catalogue').innerHTML=rows.map((r,i)=>`<option value="${esc(r[0]+' · '+r[1])}"></option>`).join('');$('library').onchange=()=>{let r=rows.find(r=>r[0]+' · '+r[1]===$('library').value);if(!r)return;for(let [k,v] of Object.entries({name:r[1],code:r[0],cp:r[2],cat:C[r[4]],mh:handbook,type:r[0]==='ExtSem'?'pass':'graded'}))$(k).value=v};let editing=null;function edit(id,n){editing=id;$('library').value='';let m=modules.find(x=>x.id===id)||{name:'',code:'',cp:5,sem:n,cat:C[5],mh:handbook,moodle:'',type:'graded',count:true};$('sem').innerHTML=Array.from({length:semesters},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('');$('cat').innerHTML=C.map(c=>`<option>${esc(c)}</option>`).join('');for(let k of ['name','code','cp','sem','cat','mh','moodle','type'])$(k).value=m[k];$('count').checked=m.count;$('del').hidden=!id;$('dialogTitle').textContent=id?'Modul bearbeiten':'Modul hinzufügen';$('dlg').showModal()}
$('form').onsubmit=e=>{e.preventDefault();let m=modules.find(x=>x.id===editing);if(!m){m={id:crypto.randomUUID?.()||String(Date.now()),points:null,passed:false};modules.push(m)}for(let k of ['name','code','cat','mh','moodle','type'])m[k]=$(k).value;m.cp=Number($('cp').value);m.sem=Number($('sem').value);m.count=$('count').checked;$('dlg').close();save();render()};function removeModule(){if(confirm('Modul löschen?')){modules=modules.filter(m=>m.id!==editing);$('dlg').close();save();render()}}function exportData(){let a=document.createElement('a');let u=URL.createObjectURL(new Blob([JSON.stringify({version:1,modules,semesters},null,2)],{type:'application/json'}));a.href=u;a.download='DAISY-Studienplan.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('file').onchange=async e=>{try{let s=JSON.parse(await e.target.files[0].text());if(s.version!==1||!Number.isInteger(s.semesters)||s.semesters<1||s.semesters>50||!Array.isArray(s.modules)||new Set(s.modules.map(m=>m.id)).size!==s.modules.length||!s.modules.every(m=>typeof m.id==='string'&&typeof m.name==='string'&&Number.isInteger(m.cp)&&m.cp>0&&m.cp<=210&&Number.isInteger(m.sem)&&m.sem>=1&&m.sem<=s.semesters&&C.includes(m.cat)&&['graded','pass'].includes(m.type)&&(m.points===null||Number.isFinite(m.points)&&m.points>=0&&m.points<=100)&&typeof m.count==='boolean'&&typeof m.passed==='boolean'))throw Error('Ungültiges Format');if(confirm('Aktuellen Plan durch Import ersetzen?')){modules=s.modules;semesters=s.semesters;save();render()}}catch(err){alert('Import fehlgeschlagen: '+err.message)}e.target.value=''};function resetData(){if(confirm('Alle Änderungen löschen und Ausgangsplan wiederherstellen?')){modules=initial();semesters=7;save();render()}}let token=null,cloudReady=false,loading=false,dirty=false,syncTimer=null,remoteVersion=null,busy=false;
const cloudStatus=t=>$('cloudStatus').textContent=t;
const payload=()=>({version:1,modules,semesters});
async function api(path,options={}){let r=await fetch('https://www.googleapis.com/'+path,{...options,headers:{...options.headers,Authorization:'Bearer '+token}});if(r.status===401){token=null;cloudReady=false;throw Error('Bitte erneut mit Google verbinden.')}if(!r.ok)throw Error('Drive: '+r.status);return r}
async function connectDrive(){try{if(!window.isSecureContext||location.protocol==='file:')throw Error('Google Drive benötigt eine registrierte HTTPS-Origin oder localhost.');let id=prompt('Öffentliche Google OAuth Client-ID (Webanwendung):');if(!id)return;if(!window.google?.accounts){await new Promise((ok,no)=>{let script=document.createElement('script');script.src='https://accounts.google.com/gsi/client';script.onload=ok;script.onerror=no;document.head.append(script)})}google.accounts.oauth2.initTokenClient({client_id:id,scope:'https://www.googleapis.com/auth/drive.appdata',callback:async r=>{if(!r.access_token){cloudStatus('Anmeldung fehlgeschlagen');return}token=r.access_token;cloudReady=false;remoteVersion=null;await pullDrive()},error_callback:()=>cloudStatus('Google-Anmeldung blockiert')}).requestAccessToken({prompt:'consent'})}catch(e){cloudStatus(e.message)}}
async function remote(){let r=await api('drive/v3/files?spaces=appDataFolder&q='+encodeURIComponent("name = 'study-planner.json' and trashed = false")+'&fields=files(id,version),nextPageToken');let f=(await r.json()).files;if(f.length>1)throw Error('Mehrere Cloud-Dateien gefunden.');return f[0]||null}
function valid(s){return s?.version===1&&Number.isInteger(s.semesters)&&s.semesters>=1&&s.semesters<=50&&Array.isArray(s.modules)&&new Set(s.modules.map(m=>m.id)).size===s.modules.length&&s.modules.every(m=>typeof m.id==='string'&&typeof m.name==='string'&&Number.isInteger(m.cp)&&m.cp>0&&m.cp<=210&&Number.isInteger(m.sem)&&m.sem>=1&&m.sem<=s.semesters&&C.includes(m.cat)&&['graded','pass'].includes(m.type)&&(m.points===null||Number.isFinite(m.points)&&m.points>=0&&m.points<=100)&&typeof m.count==='boolean'&&typeof m.passed==='boolean')}
async function pullDrive(){if(!token||busy)return;busy=true;try{let f=await remote();if(f){let s=await (await api('drive/v3/files/'+f.id+'?alt=media')).json();if(!valid(s))throw Error('Ungültige Cloud-Datei');if(!confirm('Cloud-Plan laden und lokalen Plan ersetzen?'))return;loading=true;modules=s.modules;semesters=s.semesters;remoteVersion=f.version;save();render()}else{remoteVersion=null}dirty=false;cloudReady=true;cloudStatus('Google Drive verbunden')}catch(e){cloudStatus(e.message)}finally{loading=false;busy=false}}
async function pushDrive(auto=false){if(!token||!cloudReady||busy){if(!auto)cloudStatus('Bitte zuerst verbinden und Cloud-Plan laden.');return}busy=true;try{let f=await remote();if((f?.version??null)!==remoteVersion){cloudReady=false;throw Error('Cloud-Konflikt: JSON exportieren und Cloud neu laden.')}let snapshot=JSON.stringify(payload());let boundary='planner_boundary';let body='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(f?{name:'study-planner.json'}:{name:'study-planner.json',parents:['appDataFolder']})+'\r\n--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+snapshot+'\r\n--'+boundary+'--';let r=await api('upload/drive/v3/files'+(f?'/'+f.id:'')+'?uploadType=multipart&fields=id,version',{method:f?'PATCH':'POST',headers:{'Content-Type':'multipart/related; boundary='+boundary},body});remoteVersion=(await r.json()).version;dirty=JSON.stringify(payload())!==snapshot;cloudStatus('Cloud gespeichert');if(dirty)syncTimer=setTimeout(()=>pushDrive(true),1800)}catch(e){cloudStatus(e.message)}finally{busy=false}}
$('manual').href=handbook;$('legend').innerHTML=C.map(c=>`<span><i class="dot" style="background:${cats[c]}"></i>${esc(c)}</span>`).join('');render();save();
</script></html>
